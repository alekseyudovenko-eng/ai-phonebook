<style>
/* Layout: a working address book — ask bar on top, alphabetical index on the left, the open card on the right. AI matches are marked like a highlighter pen. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --ink: #15212B;
  --muted: #5D6A77;
  --line: #D8DEE4;
  --accent: #0B6E69;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEFEC;
  --marker: #FFE27A;
  --marker-ink: #3B2F00;
  --danger: #B42318;
  --danger-soft: #FCE9E7;
  --av-bg-l: 87%;
  --av-fg-l: 24%;
  --shadow: 0 1px 2px rgba(21,33,43,.06), 0 8px 24px rgba(21,33,43,.06);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #15202A; --surface-2: #1B2833; --ink: #E5ECF1; --muted: #93A2B0; --line: #2A3742;
    --accent: #42B9AF; --accent-ink: #052220; --accent-soft: #173733; --marker: #5A4A10; --marker-ink: #FFE9A6;
    --danger: #FF8A80; --danger-soft: #3B1D1A; --av-bg-l: 27%; --av-fg-l: 86%;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #15202A; --surface-2: #1B2833; --ink: #E5ECF1; --muted: #93A2B0; --line: #2A3742;
  --accent: #42B9AF; --accent-ink: #052220; --accent-soft: #173733; --marker: #5A4A10; --marker-ink: #FFE9A6;
  --danger: #FF8A80; --danger-soft: #3B1D1A; --av-bg-l: 27%; --av-fg-l: 86%;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn:disabled { opacity: .55; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Ask bar */
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; display: flex; gap: 8px; align-items: center; }
.ask input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 10px; font-size: 17px; outline: none; }
.ask .kbd { font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.ask .btn.primary { padding: 10px 14px; }
.hint { color: var(--muted); font-size: 13px; display: flex; gap: 6px 14px; flex-wrap: wrap; }
.hint button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }

/* Filters */
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filters .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; font-size: 12px; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }

/* AI answer */
.answer { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--marker); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.answer p { margin: 0; max-width: 72ch; }
.answer .q { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.thinking { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* Main */
.main { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 14px; align-items: start; }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.listpane { position: sticky; top: 12px; max-height: calc(100dvh - 24px); overflow: auto; }
.letter { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-family: var(--f-display); font-size: 12px; font-weight: 500; padding: 4px 14px; border-bottom: 1px solid var(--line); z-index: 1; }
.row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0; }
.row:hover { background: var(--surface-2); }
.row[aria-current="true"] { background: var(--accent-soft); }
.row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .why { font-size: 13px; margin-top: 3px; }
.mark { background: var(--marker); color: var(--marker-ink); padding: 0 3px; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: hsl(var(--h) 42% var(--av-bg-l)); color: hsl(var(--h) 55% var(--av-fg-l)); flex: none; }
.av.lg { width: 64px; height: 64px; font-size: 22px; font-family: var(--f-display); font-weight: 500; }
.empty { padding: 28px 20px; color: var(--muted); text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty h3 { margin: 0; color: var(--ink); font-family: var(--f-display); font-weight: 500; font-size: 16px; }

/* Detail */
.detail { padding: 22px; display: grid; gap: 18px; }
.dhead { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.dhead .t { min-width: 0; flex: 1; }
.dhead h2 { font-family: var(--f-display); font-weight: 500; font-size: 22px; margin: 0; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.dhead .pos { color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.dactions { display: flex; gap: 6px; flex-wrap: wrap; }
.fields { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px 16px; margin: 0; }
.fields dt { color: var(--muted); font-size: 13px; padding-top: 3px; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
.fields dd { margin: 0; display: grid; gap: 4px; min-width: 0; }
.val { display: flex; align-items: center; gap: 8px; min-width: 0; }
.val .tx { overflow-wrap: anywhere; user-select: all; }
.mono { font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.copy { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px; border-radius: 4px; display: inline-grid; }
.copy:hover { color: var(--accent); background: var(--surface-2); }
.copy svg { width: 15px; height: 15px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.notes { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin: 0; overflow-wrap: anywhere; }
.hist { display: grid; gap: 8px; margin: 0 0 10px; padding: 0; list-style: none; }
.hist li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.hist .d { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.hist .x { overflow-wrap: anywhere; }
.addhist { display: flex; gap: 8px; flex-wrap: wrap; }
.addhist input[type="text"] { flex: 1 1 220px; min-width: 0; }
.meta { color: var(--muted); font-size: 12px; }
.confirm { background: var(--danger-soft); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.closer { display: none; }
img.av { object-fit: cover; background: var(--surface-2); }
.avbtn { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; position: relative; }
.avbtn::after { content: "Фото"; position: absolute; inset: auto 0 -2px 0; font-size: 10px; text-align: center; color: var(--accent-ink); background: var(--accent); border-radius: 6px; opacity: 0; transition: opacity .15s; }
.avbtn:hover::after, .avbtn:focus-visible::after { opacity: 1; }
.web { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.web .facts { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.src { font-size: 12px; color: var(--muted); margin-left: 4px; }
.src a { color: var(--muted); }
.badge { display: inline-block; font-size: 11px; border-radius: 999px; padding: 1px 8px; font-weight: 600; letter-spacing: .02em; }
.badge.high { background: var(--accent-soft); color: var(--accent); }
.badge.medium { background: var(--marker); color: var(--marker-ink); }
.badge.low { background: var(--danger-soft); color: var(--danger); }
.log { font-family: var(--f-mono); font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; max-height: 140px; overflow: auto; display: grid; gap: 2px; }
.log span { overflow-wrap: anywhere; }
.upd { display: grid; gap: 6px; }
.upd label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.upd .was { color: var(--muted); text-decoration: line-through; font-size: 13px; }
.upd .now { font-weight: 600; overflow-wrap: anywhere; }
.upd .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

/* Forms */
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="date"], input[type="search"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 70px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.grid2 .wide { grid-column: 1 / -1; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(10,16,22,.45); display: grid; place-items: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); width: min(680px, 100%); max-height: 100%; overflow: auto; padding: 20px; display: grid; gap: 14px; }
.modal h2 { font-family: var(--f-display); font-weight: 500; font-size: 18px; margin: 0; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 8px 10px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; max-height: 300px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); }
.out { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 12px; min-height: 120px; overflow-wrap: anywhere; }

.banner { background: var(--marker); color: var(--marker-ink); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: 14px; max-width: calc(100% - 32px); }

@media (max-width: 899px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .listpane { position: static; max-height: none; }
  .detailpane { position: fixed; inset: 0; z-index: 40; border-radius: 0; overflow: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .detailpane[data-open="false"] { display: none; }
  .closer { display: inline-flex; }
  .fields { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .fields dd { margin-bottom: 8px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .hist li { grid-template-columns: minmax(0, 1fr) auto; }
  .hist .d { grid-column: 1 / -1; }
}
@media (min-width: 900px) { .detailpane[data-open="false"] .detail { display: none; } }
@media (prefers-reduced-motion: reduce) { .thinking i { animation: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>ИИ Телефонная книга</h1><span class="count" id="count"></span></div>
    <div class="actions">
      <button class="btn primary" id="btnAdd" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить</button>
      <button class="btn" id="btnImport" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Импорт</button>
      <button class="btn" id="btnExport" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg>Экспорт</button>
      <button class="btn" id="btnEnrich" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Дополнить ИИ</button>
    </div>

  <div id="banner"></div>

  <form class="ask" id="askForm" autocomplete="off">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted);margin-left:6px;flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Имя, компания, страна — или вопрос: кто у меня занимается биодизелем?" aria-label="Поиск по контактам">

  <div class="main">

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").trim();
const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

const state = { contacts: [], byId: new Map(), selected: null, q: "", country: "", tag: "", ai: null, demo: false, loaded: false, confirmDelete: false };
let db = null, col = null, sample = null, downloads = null, aiCtl = null, mcp = null, assets = null, browserOK = false, browserTab = null;
const BROWSER = "host:claude_browser";

/* ---------- Contact helpers ---------- */
const arr = v => Array.isArray(v) ? v.filter(Boolean).map(String) : (v ? String(v).split(/\s*[\n;]\s*|\s*,\s*(?=[^\s])/).filter(Boolean) : []);
function clean(c) {
  return {
    name: String(c.name || "").replace(/\s+/g, " ").trim(),
    company: String(c.company || "").trim(),
    position: String(c.position || "").trim(),
    phones: [...new Set(arr(c.phones).map(s => s.trim()).filter(Boolean))],
    emails: [...new Set(arr(c.emails).map(s => s.trim().toLowerCase()).filter(s => s.includes("@")))],
    country: String(c.country || "").trim(),
    city: String(c.city || "").trim(),
    links: [...new Set(arr(c.links).map(s => s.trim()).filter(Boolean))],
    tags: [...new Set(arr(c.tags).map(s => s.trim()).filter(Boolean))],
    notes: String(c.notes || "").trim(),
    history: Array.isArray(c.history) ? c.history.filter(h => h && h.text).map(h => ({ date: String(h.date || ""), text: String(h.text) })) : [],
    source: String(c.source || "").trim(),
    photoId: /^[A-Za-z0-9_-]{8,64}$/.test(String(c.photoId || "")) ? String(c.photoId) : "",
    research: c.research && typeof c.research === "object" ? {
      at: String(c.research.at || ""), match: String(c.research.match || ""), summary: String(c.research.summary || "").slice(0, 1200),
      facts: (Array.isArray(c.research.facts) ? c.research.facts : []).slice(0, 15).map(f => ({ text: String(f?.text || "").slice(0, 400), source: String(f?.source || "") })).filter(f => f.text),
      photoPage: String(c.research.photoPage || ""),
    } : null,
  };
}
const initials = n => (n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";

/* ---------- Storage ---------- */
async function saveContact(data, id) {
  const now = Date.now();
  const prev = id ? state.byId.get(id) : null;
  const body = { ...clean(data), createdAt: prev?.createdAt || now, updatedAt: now };
  if (state.demo) {
    const nid = id || "ex" + now;
    const list = state.contacts.filter(c => c.id !== nid).map(stripPriv);
    list.push({ id: nid, ...body });
    indexContacts(list); render();
    return nid;
  }
  const ref = id ? col.doc(id) : col.doc();
  await ref.set(body);
  return ref.id;
}
async function removeContact(id) {
  if (state.demo) { indexContacts(state.contacts.filter(c => c.id !== id).map(stripPriv)); render(); return; }
  await col.doc(id).delete();
}
function stripPriv(c) { const o = { ...c }; delete o._hay; return o; }

/* ---------- Rendering ---------- */
function filtered() {
  let list = state.contacts;
  if (state.country) list = list.filter(c => c.country === state.country);
  if (state.tag) list = list.filter(c => (c.tags || []).includes(state.tag));
  if (state.ai && !state.ai.loading && !state.ai.error) {
    const order = new Map(state.ai.matches.map((m, i) => [m.id, i]));
    return list.filter(c => order.has(c.id)).sort((a, b) => order.get(a.id) - order.get(b.id));
  }
  const toks = norm(state.q).split(" ").filter(Boolean);
  if (toks.length) list = list.filter(c => toks.every(t => c._hay.includes(t)));
  return list;
}

}

async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); toast("Скопировано"); }
  catch { const tx = btn?.previousElementSibling; if (tx) { const r = document.createRange(); r.selectNodeContents(tx); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Выделено — нажмите Ctrl+C"); }
}
let toastT;
function toast(msg) { const r = $("#toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => r.innerHTML = "", 2600); }
function dbErr(e) {
  const c = e?.code;
  if (c === "quota_exceeded") return "Хранилище заполнено — удалите ненужные контакты.";
  if (c === "invalid_argument") return "Сохранять контакты может только владелец книги.";
  if (c === "resource_exhausted") return "Слишком много изменений подряд — подождите немного.";
  return "Не удалось сохранить. Проверьте соединение и попробуйте ещё раз.";
}
function aiErr(e) {
  const c = e?.code;
  if (c === "not_granted" || c === "sampling_disabled") return "ИИ не разрешён для этой страницы.";
  if (c === "rate_limited") return "Слишком много запросов к ИИ. Попробуйте через минуту.";
  if (c === "prompt_too_large") return "Слишком много данных для одного запроса — сузьте выборку фильтрами.";
  if (c === "invalid_json") return "ИИ ответил в неожиданном формате. Попробуйте ещё раз.";
  if (c === "session_expired") return "Сессия истекла — войдите в Claude заново.";
  return "ИИ сейчас не отвечает. Попробуйте ещё раз.";
}

Контакты:
${lines.join("\n")}`;

/* ---------- Import ---------- */
function decode(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf).replace(/^\uFEFF/, ""); }
  catch { return new TextDecoder("windows-1251").decode(buf); }
}
function parseCSV(text) {
  const first = text.split(/\r?\n/)[0] || "";
  const d = [";", ",", "\t"].map(x => [x, first.split(x).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
function mapHeader(h) {
  const s = norm(h);
  if (/type|label|тип/.test(s) && !/^labels?$/.test(s)) return null;
  if (/^(first.?name|given.?name|имя)$/.test(s)) return "first";
  if (/^(middle.?name|additional.?name|отчество)$/.test(s)) return "middle";
  if (/(last.?name|family.?name|фамилия|surname)/.test(s)) return "last";
  if (/^(name|full.?name|display.?name|фио|контакт|имя и фамилия)$/.test(s)) return "name";
  if (/(organi[sz]ation.?title|job.?title|position|должност|^title$)/.test(s)) return "position";
  if (/(company|organi[sz]ation|компан|организац|^org)/.test(s)) return "company";
  if (/(e-?mail|почта|^mail)/.test(s)) return "emails";
  if (/(phone|tel|mobile|телефон|моб)/.test(s)) return "phones";
  if (/(country|страна)/.test(s)) return "country";
  if (/(city|город|locality)/.test(s)) return "city";
  if (/(tag|group|labels?|теги|группа|категори)/.test(s)) return "tags";
  if (/(url|website|site|сайт|link|linkedin|social)/.test(s)) return "links";
  if (/(note|коммент|примеч|mention|описан)/.test(s)) return "notes";
  return null;
}
function rowsToContacts(rows) {
  if (rows.length < 2) return [];
  const map = rows[0].map(mapHeader);
  return rows.slice(1).map(r => {
    const c = { phones: [], emails: [], links: [], tags: [], notes: [] }, nm = {};
    r.forEach((v, i) => {
      const k = map[i]; v = String(v ?? "").trim(); if (!k || !v) return;
      const parts = v.split(/\s*:::\s*/);
      if (k === "first" || k === "middle" || k === "last" || k === "name") nm[k] = v;
      else if (k === "phones" || k === "emails" || k === "links") c[k].push(...parts.flatMap(p => k === "emails" ? p.split(/[;,\s]+/) : [p]));
      else if (k === "tags") c.tags.push(...parts.flatMap(p => p.split(/[,;]/)).map(t => t.replace(/^\*\s*/, "").trim()).filter(t => t && !/^myContacts$/i.test(t)));
      else if (k === "notes") c.notes.push(v);
      else c[k] = c[k] ? c[k] : v;
    });
    c.name = nm.name || [nm.first, nm.middle, nm.last].filter(Boolean).join(" ");
    c.notes = c.notes.join("\n");
    return clean(c);
  }).filter(c => c.name || c.company || c.emails.length);
}
function parseVCF(text) {
  const lines = text.replace(/\r\n[ \t]/g, "").replace(/\n[ \t]/g, "").split(/\r?\n/);
  const out = []; let c = null;
  const val = l => l.slice(l.indexOf(":") + 1).replace(/\\n/gi, "\n").replace(/\\([,;\\])/g, "$1").trim();
  for (const l of lines) {
    const key = l.split(":")[0].split(";")[0].toUpperCase().replace(/^ITEM\d+\./, "");
    if (key === "BEGIN") c = { phones: [], emails: [], links: [], tags: [] };
    else if (key === "END" && c) { out.push(clean(c)); c = null; }
    else if (!c) continue;
    else if (key === "FN") c.name = val(l);
    else if (key === "N" && !c.name) { const p = val(l).split(";"); c.name = [p[1], p[2], p[0]].filter(Boolean).join(" "); }
    else if (key === "ORG") c.company = val(l).split(";").filter(Boolean).join(", ");
    else if (key === "TITLE") c.position = val(l);
    else if (key === "TEL") c.phones.push(val(l));
    else if (key === "EMAIL") c.emails.push(val(l));
    else if (key === "URL") c.links.push(val(l));
    else if (key === "NOTE") c.notes = val(l);
    else if (key === "CATEGORIES") c.tags.push(...val(l).split(","));
    else if (key === "ADR") { const p = val(l).split(";"); c.city = c.city || p[3] || ""; c.country = c.country || p[6] || ""; }
  }
  return out.filter(c => c.name || c.company || c.emails.length);
}
async function readFile(file) {
  const buf = await file.arrayBuffer();
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (ext === "vcf") return parseVCF(decode(buf));
  if (ext === "xlsx" || ext === "xls") {
    if (!window.XLSX) throw new Error("Excel-модуль не загрузился. Сохраните файл как CSV.");
    const wb = XLSX.read(buf, { type: "array" });
    return rowsToContacts(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" }));
  }
  const t = decode(buf);
  if (/BEGIN:VCARD/i.test(t)) return parseVCF(t);
  return rowsToContacts(parseCSV(t));
}

/* ---------- Web research ---------- */
function toolText(r) {
  if (typeof r?.payload === "string") return r.payload;
  const t = (r?.content || []).filter(b => b && b.type === "text").map(b => b.text).join("\n");
  return t || (r?.payload ? JSON.stringify(r.payload) : "");
}
async function br(tool, input, signal) { return toolText(await mcp.callTool(BROWSER, tool, input, { cache: false, signal })); }
async function pageText(url, max, signal) {
  let opened = false;
  if (browserTab) { try { await br("navigate", { url, tabId: browserTab }, signal); opened = true; } catch (e) { if (e?.code === "cancelled") throw e; browserTab = null; } }
  if (!opened) { const t = await br("preview_start", { url }, signal); const m = /tabId\s+([^\s)]+)/.exec(t); browserTab = m ? m[1] : null; }
  return br("get_page_text", browserTab ? { tabId: browserTab, max_chars: max } : { max_chars: max }, signal);
}
const ddgClean = t => { const i = t.indexOf("Past Year"); return (i > 0 ? t.slice(i + 9) : t).replace(/\n{3,}/g, "\n\n").trim(); };
const BLOCKED = /unusual traffic|необычный трафик|not a robot|не робот|\/sorry\/|recaptcha|Before you continue to Google|Прежде чем перейти к Google/i;
async function webSearch(q, signal) {
  try {
    const t = await pageText("https://www.google.com/search?hl=ru&num=10&q=" + encodeURIComponent(q), 9000, signal);
    if (!BLOCKED.test(t) && t.length > 400) {
      const i = t.search(/Результаты поиска|Search Results/);
      let links = [];
      try {
        const tree = await br("read_page", { ...(browserTab ? { tabId: browserTab } : {}), filter: "interactive", max_chars: 20000 }, signal);
        links = [...new Set([...tree.matchAll(/href="(https?:\/\/[^"]+)"/g)].map(m => m[1].replace(/&amp;/g, "&")))]
          .filter(u => !/(^https?:\/\/([a-z0-9-]+\.)*(google|gstatic|googleusercontent|youtube\.com\/results|webcache)\.|\/search\?|accounts\.google)/i.test(u)).slice(0, 25);
      } catch (e) { if (signal?.aborted) throw e; }
      return { engine: "Google", text: (i > 0 ? t.slice(i) : t).replace(/\n{3,}/g, "\n\n").trim() + (links.length ? "\n\nТочные ссылки из выдачи:\n" + links.join("\n") : "") };
    }
  } catch (e) { if (signal?.aborted) throw e; if (e?.code === "server_not_connected") throw e; }
  return { engine: "DuckDuckGo", text: ddgClean(await pageText("https://html.duckduckgo.com/html/?q=" + encodeURIComponent(q), 7000, signal)) };
}
function imageBlock(r) { const b = (r?.content || []).find(x => x && x.type === "image" && x.data); return b ? { data: b.data, mime: b.mimeType || "image/png" } : null; }
function b64Blob({ data, mime }) { const bin = atob(data); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); }
async function screenshotTab(signal) {
  const r = await mcp.callTool(BROWSER, "computer", browserTab ? { action: "screenshot", tabId: browserTab, scale: 1 } : { action: "screenshot", scale: 1 }, { cache: false, signal });
  const img = imageBlock(r); if (!img) throw { code: "no_image" };
  const m = /coordinate frame:\s*(\d+)\s*x\s*(\d+)/i.exec(toolText(r));
  return { ...img, frameW: m ? +m[1] : 0, frameH: m ? +m[2] : 0 };
}
async function zoomTab(region, signal) {
  const r = await mcp.callTool(BROWSER, "computer", { action: "zoom", region, ...(browserTab ? { tabId: browserTab } : {}), scale: 1 }, { cache: false, signal });
  const img = imageBlock(r); if (!img) throw { code: "no_image" };
  return b64Blob(img);
}
function mcpErr(e) {
  const c = e?.code;
  if (c === "server_not_connected") return "браузер Claude недоступен — откройте книгу в приложении Claude для компьютера";
  if (c === "cancelled") return "доступ к сайту не разрешён";
  if (c === "not_in_manifest" || c === "approval_required") return "браузер не разрешён для этой страницы";
  if (c === "tool_error") return "сайт не открылся";
  return "ошибка браузера";
}
const cardJSON = c => JSON.stringify({ name: c.name, company: c.company, position: c.position, phones: c.phones, emails: c.emails, country: c.country, city: c.city, links: c.links });
const VERIFY_RULES = `Задача: проверить и обновить карточку делового контакта по материалам из интернета ниже. Сегодня ${today()}.

  const c = state.byId.get(id); if (!c || !assets) return;
  openModal(`<h2>Фото: ${esc(c.name || c.company)}</h2>
    <div class="drop" id="phDrop" tabindex="0"><div>Перетащите фото сюда или вставьте из буфера (Ctrl+V)</div><label class="btn"><input type="file" id="phIn" accept="image/png,image/jpeg,image/webp,image/gif" hidden>Выбрать файл</label><span class="note" id="phNote">${c.research?.photoPage ? `Фото было найдено на ${esc(host(c.research.photoPage))} — сохраните его оттуда.` : "Подойдёт фото с сайта компании или из LinkedIn."}</span></div>
    ${browserOK ? `<div class="section" style="display:grid;gap:8px"><h3 style="margin:0">Или найти в Google Картинках</h3>
      <form id="phSearch" style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="phQ" style="flex:1 1 240px;min-width:0" value="${esc([c.name, c.company.replace(/\b(GmbH|AG|LLC|Ltd\.?|Group)\b/gi, "").trim()].filter(Boolean).join(" "))}" aria-label="Запрос для поиска фото"><button class="btn" type="submit">Найти</button></form>
      <div id="phShot"></div></div>` : ""}
    <div class="foot">${c.photoId ? `<button class="btn ghost danger" type="button" id="phDel">Убрать фото</button>` : ""}<button class="btn" type="button" id="phClose">Закрыть</button><button class="btn primary" type="button" id="phSave" hidden>Сохранить выделенное</button></div>`, m => {
    $("#phClose", m).onclick = closeModal;
    const note = $("#phNote", m), drop = $("#phDrop", m);
    let shot = null, sel = null;
    $("#phSearch", m) && ($("#phSearch", m).onsubmit = async ev => {
      ev.preventDefault();
      const q = $("#phQ", m).value.trim(); if (!q) return;
      const box = $("#phShot", m); sel = null; $("#phSave", m).hidden = true;
      modalCtl?.abort(); modalCtl = new AbortController(); const signal = modalCtl.signal;
      box.innerHTML = `<span class="thinking"><i></i><i></i><i></i>&nbsp;Открываю Google Картинки…</span>`;
      try {
        if (browserTab) { try { await br("navigate", { url: "https://www.google.com/search?hl=ru&udm=2&q=" + encodeURIComponent(q), tabId: browserTab }, signal); } catch (e) { if (signal.aborted) return; browserTab = null; } }
        if (!browserTab) { const t = await br("preview_start", { url: "https://www.google.com/search?hl=ru&udm=2&q=" + encodeURIComponent(q) }, signal); const mm = /tabId\s+([^\s)]+)/.exec(t); browserTab = mm ? mm[1] : null; }
        try { await mcp.callTool(BROWSER, "computer", { action: "wait", duration: 1.5, ...(browserTab ? { tabId: browserTab } : {}) }, { cache: false, signal }); } catch (e) { if (signal.aborted) return; }
        shot = await screenshotTab(signal);
        box.innerHTML = `<p class="note" style="margin:0 0 6px">Нажмите на лицо или обведите его рамкой — выделенное станет фото контакта. Убедитесь, что это тот самый человек.</p>
          <div id="phPick" style="position:relative;touch-action:none;user-select:none;cursor:crosshair;border-radius:8px;overflow:hidden;border:1px solid var(--line)"><img id="phImg" alt="Снимок Google Картинок" style="display:block;width:100%;height:auto" src="data:${esc(shot.mime)};base64,${shot.data}"><div id="phSel" hidden style="position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.35);border-radius:4px"></div></div>`;
        const pick = $("#phPick", m), img = $("#phImg", m), selEl = $("#phSel", m);
        let start = null;
        const pt = e => { const r = img.getBoundingClientRect(); return { x: Math.max(0, Math.min(r.width, e.clientX - r.left)), y: Math.max(0, Math.min(r.height, e.clientY - r.top)), w: r.width, h: r.height }; };
        const draw = (a, b) => {
          let side = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y));
          if (side < 12) side = Math.min(a.w, a.h) * 0.22;
          let x = side === Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y)) ? Math.min(a.x, b.x) : a.x - side / 2;
          let y = side === Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y)) ? Math.min(a.y, b.y) : a.y - side / 2;
          x = Math.max(0, Math.min(a.w - side, x)); y = Math.max(0, Math.min(a.h - side, y)); side = Math.min(side, a.w, a.h);
          Object.assign(selEl.style, { left: x + "px", top: y + "px", width: side + "px", height: side + "px" }); selEl.hidden = false;
          const k = img.naturalWidth / a.w; sel = { x: x * k, y: y * k, s: side * k };
          $("#phSave", m).hidden = false;
        };
        pick.onpointerdown = e => { start = pt(e); pick.setPointerCapture(e.pointerId); draw(start, start); };
        pick.onpointermove = e => { if (start) draw(start, pt(e)); };
        pick.onpointerup = e => { if (start) draw(start, pt(e)); start = null; };
      } catch (e) {
        if (signal.aborted) return;
        box.innerHTML = `<p class="note">Не удалось получить картинки: ${esc(e?.code === "no_image" ? "браузер не вернул снимок" : mcpErr(e))}.</p>`;
      }
    });
    $("#phSave", m).onclick = async () => {
      if (!shot || !sel) return;
      $("#phSave", m).disabled = true; note.innerHTML = `<span class="thinking"><i></i><i></i><i></i>&nbsp;Сохраняю фото…</span>`;
      let blob = null;
      if (shot.frameW) {
        const img = $("#phImg", m), k = shot.frameW / img.naturalWidth;
        try { blob = await zoomTab([Math.round(sel.x * k), Math.round(sel.y * k), Math.round((sel.x + sel.s) * k), Math.round((sel.y + sel.s) * k)], modalCtl?.signal); } catch { blob = null; }
      }
      if (!blob) {
        const img = $("#phImg", m), cv = document.createElement("canvas"), side = Math.round(sel.s);
        cv.width = side; cv.height = side; cv.getContext("2d").drawImage(img, sel.x, sel.y, sel.s, sel.s, 0, 0, side, side);
        blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
      }
      $("#phSave", m).disabled = false;
      if (blob) put(new File([blob], "photo.jpg", { type: blob.type || "image/jpeg" })); else note.textContent = "Не удалось вырезать фото.";
    };
    const put = async f => {
      if (!f || !/^image\/(png|jpeg|webp|gif)$/.test(f.type)) { note.textContent = "Нужна картинка PNG, JPEG, WebP или GIF."; return; }
      note.innerHTML = `<span class="thinking"><i></i><i></i><i></i>&nbsp;Загружаю…</span>`;
      try {
        const blob = await shrink(f);
        const up = await assets.upload(blob, { type: blob.type });
        const cur = state.byId.get(id); const old = cur.photoId;
        const data = stripPriv(cur); data.photoId = up.id;
        await saveContact(data, id);
        if (old && old !== up.id) assets.delete(old).catch(() => {});
        closeModal(); toast("Фото сохранено"); render();
      } catch (e) {
        note.textContent = e?.code === "too_large" ? "Файл слишком большой." : e?.code === "quota_or_state" ? "Хранилище фото заполнено." : "Не удалось загрузить фото.";
      }
    };
    $("#phIn", m).onchange = e => put(e.target.files[0]);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); put(e.dataTransfer.files[0]); };
    m.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith("image/")); if (f) { e.preventDefault(); put(f); } });
    drop.focus();
    $("#phDel", m) && ($("#phDel", m).onclick = async () => {
      const cur = state.byId.get(id); const old = cur.photoId; const data = stripPriv(cur); data.photoId = "";
      try { await saveContact(data, id); if (old) assets.delete(old).catch(() => {}); closeModal(); render(); } catch (e) { toast(dbErr(e)); }
    });
  });
}
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 512 / Math.max(bmp.width, bmp.height));
    if (s === 1 && file.size < 400000) return file;
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(b => r(b || file), "image/jpeg", 0.88));
  } catch { return file; }
}

/* ---------- Wiring ---------- */
$("#btnAdd").onclick = () => openEditor();
$("#btnImport").onclick = openImport;
$("#btnExport").onclick = openExport;
$("#btnEnrich").onclick = openEnrich;
$("#q").addEventListener("input", e => { state.q = e.target.value; if (state.ai && !state.ai.loading) state.ai = null; renderAnswer(); renderList(); });
$("#askForm").onsubmit = e => { e.preventDefault(); const q = $("#q").value.trim(); if (q && sample) askAI(q); };
$$("[data-ex]").forEach(b => b.onclick = () => { $("#q").value = b.dataset.ex; state.q = ""; askAI(b.dataset.ex); });
window.addEventListener("resize", () => renderDetail());

function enableAI() {
  const on = !!sample;
  $("#btnAsk").hidden = !on; $("#kbdHint").hidden = !on; $("#examples").hidden = !on; $("#btnEnrich").hidden = !on;
  if (!on) $("#q").placeholder = "Поиск по имени, компании, стране, почте…";
}
function enterDemo() { state.demo = true; state.loaded = true; indexContacts(EXAMPLES); render(); }

render();
(async () => {
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") { enterDemo(); return; }
  const [d, s, dl, mc, as] = await Promise.all([cl.use("db"), cl.use("sample"), cl.use("downloads"), cl.use("mcp"), cl.use("assets")]);
  db = d; sample = s; downloads = dl; mcp = mc; assets = as;
  enableAI();
  if (mcp) mcp.listTools(BROWSER).then(r => { browserOK = !!r?.servers?.some(x => x.server === BROWSER); }).catch(() => { browserOK = false; });
  if (!db) { enterDemo(); return; }
  col = db.collection("contacts");
  col.onSnapshot(snap => {
    indexContacts(snap.docs.map(x => ({ id: x.id, ...x.data() })));
    state.loaded = true; render();
  }, () => { toast("Связь с хранилищем потеряна — обновите страницу."); });
})();
</script>
